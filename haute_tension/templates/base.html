<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Haute Tension{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #251c16;
            --muted: #706157;
            --paper: #fffdf8;
            --canvas: #eee8dd;
            --accent: #8a3027;
            --accent-dark: #642019;
            --line: #d8cdbd;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--canvas);
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.65;
        }

        a { color: inherit; }

        .site-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 253, 248, 0.88);
        }

        .site-name {
            display: inline-block;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-decoration: none;
            text-transform: uppercase;
        }

        main {
            width: min(100% - 2rem, 48rem);
            margin: 0 auto;
            padding: clamp(2rem, 7vw, 5rem) 0;
        }

        .card {
            padding: clamp(1.5rem, 6vw, 4rem);
            border: 1px solid var(--line);
            border-radius: 0.35rem;
            background: var(--paper);
            box-shadow: 0 1rem 3rem rgba(71, 52, 38, 0.09);
        }

        .eyebrow, .page-number {
            margin: 0 0 0.75rem;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1, h2 { line-height: 1.15; }

        h1 {
            margin: 0;
            font-size: clamp(2.3rem, 8vw, 4.6rem);
            font-weight: 500;
        }

        h2 { margin-top: 2.5rem; }

        .book-description {
            max-width: 34rem;
            margin: 1.5rem 0 2rem;
            color: var(--muted);
            font-size: 1.1rem;
        }

        .button, .choice-link {
            display: inline-block;
            border-radius: 0.25rem;
            font-family: Arial, sans-serif;
            font-weight: 700;
            text-decoration: none;
        }

        .button {
            padding: 0.8rem 1.1rem;
            color: white;
            background: var(--accent);
        }

        .button:hover, .button:focus-visible { background: var(--accent-dark); }

        .reader-title {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
        }

        .reader-title h1 { font-size: clamp(1.7rem, 5vw, 2.7rem); }

        .story-text {
            font-size: clamp(1.05rem, 2.5vw, 1.2rem);
        }

        .story-text p:first-child::first-letter {
            float: left;
            margin: 0.08em 0.12em 0 0;
            color: var(--accent);
            font-size: 3.2em;
            line-height: 0.85;
        }

        .choices {
            margin: 1.5rem 0 2.5rem;
            padding: 0 0 2rem;
            border-bottom: 1px solid var(--line);
        }

        .choices ul {
            display: grid;
            gap: 0.75rem;
            margin: 1rem 0 0;
            padding: 0;
            list-style: none;
        }

        .choice-link {
            display: block;
            padding: 0.85rem 1rem;
            border: 1px solid var(--line);
            background: #f8f3ea;
        }

        .choice-link:hover, .choice-link:focus-visible {
            border-color: var(--accent);
            color: var(--accent);
        }

        .end-note { color: var(--muted); }

        @media (max-width: 36rem) {
            main { width: min(100% - 1rem, 48rem); padding-top: 0.5rem; }
            .card { border-radius: 0; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="{{ url_for('web.landing_page') }}">Haute Tension</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
