<!DOCTYPE html>
<html>
<head>
    <title>Voice Recorder</title>
</head>
<body>
    <h1>Voice to Text</h1>
    <button id="recordBtn" onclick="startRecording()">🎤 Record (5 seconds)</button>
    <div id="result"></div>

    <script>
    let mediaRecorder;
    let audioChunks = [];

    function startRecording() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            console.log("getUserMedia supported.");

            navigator.mediaDevices
                .getUserMedia({
                    audio: true,
                })
                // Success callback
                .then((stream) => {
                    console.log("Microphone access granted");

                    // Create MediaRecorder
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    // Handle data available
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    // Handle recording stop
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        await uploadAudio(audioBlob);

                        // Stop all tracks
                        stream.getTracks().forEach(track => track.stop());

                        // Reset button
                        document.getElementById('recordBtn').innerHTML = '🎤 Record (5 seconds)';
                        document.getElementById('recordBtn').disabled = false;
                    };

                    // Start recording
                    mediaRecorder.start();

                    // Update button
                    document.getElementById('recordBtn').innerHTML = '🔴 Recording... (5s)';
                    document.getElementById('recordBtn').disabled = true;

                    // Auto-stop after 5 seconds
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 5000);
                })
                // Error callback
                .catch((err) => {
                    console.error(`The following getUserMedia error occurred: ${err}`);
                    alert(`Microphone error: ${err.message}`);
                });
        } else {
            console.log("getUserMedia not supported on your browser!");
            alert("Your browser doesn't support audio recording");
        }
    }

    async function uploadAudio(audioBlob) {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'recording.wav');

        try {
            const response = await fetch('/transcribe', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('result').innerHTML = `<p><strong>You said:</strong> ${result.text}</p>`;
            } else {
                throw new Error('Failed to transcribe audio');
            }
        } catch (error) {
            console.error('Upload error:', error);
            document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }
    </script>
</body>
</html>
