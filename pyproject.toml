[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haute-tension"
version = "0.1.0"
description = "A Flask adaptation of La Forteresse d'Alamuth"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai~=1.97.0",
    "pygame~=2.6.1",
    "PyYAML~=6.0.2",
    "bs4~=0.0.2",
    "beautifulsoup4~=4.13.4",
    "Flask~=3.1.1",
]

[tool.setuptools]
packages = [
    "haute_tension",
    "haute_tension.application",
    "haute_tension.application.models",
]

[tool.setuptools.package-data]
haute_tension = [
    "books/*/*/*.json",
    "templates/*.html",
]
