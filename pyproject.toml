[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haute-tension"
version = "0.1.0"
description = "A Flask adaptation of La Forteresse d'Alamuth"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyYAML~=6.0.2",
    "bs4~=0.0.2",
    "beautifulsoup4~=4.13.4",
    "Flask~=3.1.1",
]

[project.optional-dependencies]
test = [
    "pytest~=8.4.1",
    "pytest-cov~=6.2.1",
]

[tool.setuptools]
packages = [
    "haute_tension",
    "haute_tension.application",
    "haute_tension.application.models",
]

[tool.setuptools.package-data]
haute_tension = [
    "books/*/*/*.json",
    "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=haute_tension --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["haute_tension"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
